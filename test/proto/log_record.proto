syntax = "proto3";

package my_log.proto;

message LogRecord {
  enum Level {
    LEVEL_UNKNOWN = 0;
    TRACE = 1;
    DEBUG = 2;
    INFO = 3;
    WARN = 4;
    ERROR = 5;
    FATAL = 6;
  }

  uint64 timestamp_ns = 1;
  Level level = 2;
  uint32 thread_id = 3;
  string module = 4;
  string message = 5;
}

message LogBatch {
  string source = 1;
  repeated LogRecord records = 2;
}
